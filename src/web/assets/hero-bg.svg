<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" fill="none" aria-hidden="true">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.3" fill="#8B7FF5" fill-opacity="0.2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7C6FF5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7C6FF5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1440" height="520" fill="url(#dots)"/>
  <ellipse cx="720" cy="0" rx="780" ry="330" fill="url(#glow)"/>

  <ellipse cx="720" cy="60"  rx="430" ry="200" fill="#7C6FF5" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="370" cy="140" rx="240" ry="130" fill="#8B7FF5" opacity="0.13" filter="url(#soft)"/>
  <ellipse cx="1080" cy="170" rx="280" ry="140" fill="#5A51D8" opacity="0.15" filter="url(#soft)"/>

  <circle cx="720" cy="110" r="250" stroke="#7C6FF5" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="720" cy="110" r="165" stroke="#8B7FF5" stroke-opacity="0.14" stroke-width="1.5"/>
  <path d="M 240 470 A 480 480 0 0 1 1200 470" stroke="#8B7FF5" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
